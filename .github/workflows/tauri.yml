name: macOS Desktop Build (Tauri)

# Refs #143 (desktop ship plan, EPIC-B): paths/working-directory used to
# say 'zerodb-local/desktop/**' and 'zerodb-local/desktop', matching this
# repo's layout BEFORE #1 ("Flatten repo layout -- promote zerodb-local/*
# to repo root") moved desktop/ (and everything else) up to the repo
# root. Same bug class ci.yml documents fixing for itself (Refs #43):
# both historical runs of this workflow show `failure` -- the run right
# after the flatten failed in 20 seconds (cd into a directory that no
# longer existed), and the paths: filter has matched nothing since.
# Updated every path to the real post-flatten 'desktop/' layout.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/tauri.yml'
  pull_request:
    paths:
      - 'desktop/**'

jobs:
  build-macos:
    name: Build macOS .dmg
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Set up Python (sidecar)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps + PyInstaller
        run: pip install -e ".[lite]" pyinstaller

      # Refs #141 (desktop ship plan, EPIC-A): `tauri build --target
      # universal-apple-darwin` requires an externalBin for BOTH
      # architectures (binaries/zerodb-server-aarch64-apple-darwin AND
      # -x86_64-apple-darwin) -- it lipo's them together itself. Built
      # here rather than committed to git: a real PyInstaller onefile
      # binary is ~250MB, which has no business living in version
      # control. macos-latest runners are arm64 natively; the x86_64
      # build runs under Rosetta via `arch -x86_64` with an x86_64
      # Python interpreter installed for that purpose.
      - name: Build sidecar binary (arm64, native)
        run: |
          pyinstaller desktop/zerodb-server.spec --distpath desktop/src-tauri/binaries --workpath /tmp/pyi-build-arm64
          mv desktop/src-tauri/binaries/zerodb-server desktop/src-tauri/binaries/zerodb-server-aarch64-apple-darwin

      - name: Install x86_64 Python (Rosetta) for the Intel sidecar build
        run: |
          softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/python3 -m venv /tmp/x86-venv || arch -x86_64 python3 -m venv /tmp/x86-venv
          # The system/Rosetta Python's bundled pip (21.2.4 on this runner image)
          # predates PEP 660 editable installs for pyproject.toml-only projects
          # (no setup.py) -- confirmed directly: "File 'setup.py' or 'setup.cfg'
          # not found... editable mode currently requires a setuptools-based
          # build." Upgrading pip inside the venv first fixes it, same as the
          # arm64 leg already gets for free from actions/setup-python's modern
          # pip.
          arch -x86_64 /tmp/x86-venv/bin/pip install --upgrade pip
          arch -x86_64 /tmp/x86-venv/bin/pip --version

      - name: Build sidecar binary (x86_64, via Rosetta)
        run: |
          arch -x86_64 /tmp/x86-venv/bin/pip install -e ".[lite]" pyinstaller
          arch -x86_64 /tmp/x86-venv/bin/pyinstaller desktop/zerodb-server.spec --distpath /tmp/pyi-dist-x86 --workpath /tmp/pyi-build-x86
          mv /tmp/pyi-dist-x86/zerodb-server desktop/src-tauri/binaries/zerodb-server-x86_64-apple-darwin

      - name: Smoke-test both sidecar binaries
        run: |
          for bin in desktop/src-tauri/binaries/zerodb-server-aarch64-apple-darwin desktop/src-tauri/binaries/zerodb-server-x86_64-apple-darwin; do
            "$bin" &
            SERVER_PID=$!
            for i in $(seq 1 10); do
              if curl -sf http://127.0.0.1:8000/health >/dev/null; then
                echo "$bin: healthy"
                break
              fi
              sleep 1
            done
            curl -sf http://127.0.0.1:8000/health || (echo "$bin: FAILED health check" && exit 1)
            kill $SERVER_PID
            wait $SERVER_PID 2>/dev/null || true
          done

      - name: Install Node deps
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app (universal binary)
        working-directory: desktop
        run: npx tauri build --target universal-apple-darwin
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroDBLocal-macOS-${{ github.ref_name }}
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
