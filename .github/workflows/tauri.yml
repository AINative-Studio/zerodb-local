name: Desktop Build (Tauri)

# Refs #143 (desktop ship plan, EPIC-B): paths/working-directory used to
# say 'zerodb-local/desktop/**' and 'zerodb-local/desktop', matching this
# repo's layout BEFORE #1 ("Flatten repo layout -- promote zerodb-local/*
# to repo root") moved desktop/ (and everything else) up to the repo
# root. Same bug class ci.yml documents fixing for itself (Refs #43):
# both historical runs of this workflow show `failure` -- the run right
# after the flatten failed in 20 seconds (cd into a directory that no
# longer existed), and the paths: filter has matched nothing since.
# Updated every path to the real post-flatten 'desktop/' layout.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/tauri.yml'
  pull_request:
    paths:
      - 'desktop/**'

jobs:
  build-macos:
    name: Build macOS .dmg
    runs-on: macos-latest
    # Refs #148: the full signed/notarized build (run 45878893918)
    # succeeded all the way through -- the only failure was the final
    # "Attach to GitHub Release" step, with a 403 "Resource not
    # accessible by integration" because this repo's default
    # GITHUB_TOKEN has no explicit permissions block and defaults to
    # read-only on contents. softprops/action-gh-release needs
    # contents: write to create a release and upload assets to it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Refs #141 (desktop ship plan, EPIC-A): `tauri build --target
      # universal-apple-darwin` only auto-merges the Rust binary Cargo
      # compiles -- externalBin sidecars are raw files Tauri just copies
      # by exact name, so it does NOT lipo them for us (confirmed: CI
      # failed with "resource path binaries/zerodb-server-universal-
      # apple-darwin doesn't exist" until the explicit lipo step below
      # was added). Built here rather than committed to git: a real
      # PyInstaller onefile binary is ~250MB, which has no business
      # living in version control.
      #
      # x86_64 leg built FIRST, before the native arm64 setup-python step
      # below changes `python`/`python3` on PATH. Root cause of the
      # repeated IncompatibleBinaryArchError failures here (numpy as
      # arm64 on the x86_64 leg, then watchfiles as x86_64 on the arm64
      # leg): both actions/setup-python calls -- architecture: x64 AND
      # architecture: arm64 -- install Python 3.12 via the same macOS
      # .pkg installer, to the SAME absolute path
      # (/Library/Frameworks/Python.framework/Versions/3.12/...). Giving
      # each leg its own PIP_CACHE_DIR did nothing, because the problem
      # was never pip's download cache -- it's that both legs' `pip
      # install` write into the same site-packages directory, so the
      # second leg's install sees "Requirement already satisfied" for any
      # package the first leg already installed, and silently reuses that
      # package's wheel's compiled .so from the FIRST leg's architecture.
      # Each leg now creates its own venv (isolating site-packages
      # properly, unlike a shared system install) under the interpreter
      # `arch -x86_64`/`arch -arm64` selects, so neither leg's installed
      # packages are ever visible to the other. The hand-rolled
      # `/usr/bin/python3` alternative remains unusable for the same
      # reason noted before: it resolves to system Python 3.9.6, which
      # fails this repo's `requires-python >=3.10`, and ships pip 21.2.4,
      # which predates PEP 660 editable installs for
      # pyproject.toml-only/hatchling projects.
      - name: Set up Python 3.12 (x86_64, for the Intel sidecar build)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Build sidecar binary (x86_64)
        env:
          PYINSTALLER_TARGET_ARCH: x86_64
        run: |
          arch -x86_64 python3 -m venv /tmp/venv-x86_64
          source /tmp/venv-x86_64/bin/activate
          python3 -c "import platform; print('machine:', platform.machine())"
          arch -x86_64 python3 -m pip install -e ".[lite]" pyinstaller
          arch -x86_64 python3 -m PyInstaller desktop/zerodb-server.spec --distpath /tmp/pyi-dist-x86 --workpath /tmp/pyi-build-x86
          deactivate
          mv /tmp/pyi-dist-x86/zerodb-server desktop/src-tauri/binaries/zerodb-server-x86_64-apple-darwin
          # lipo -archs reads the Mach-O header itself, which can't lie
          # about what instructions the binary contains -- the one
          # trustworthy check regardless of what platform.machine() says.
          actual_arch=$(lipo -archs desktop/src-tauri/binaries/zerodb-server-x86_64-apple-darwin)
          echo "zerodb-server-x86_64-apple-darwin reports: $actual_arch"
          if [ "$actual_arch" != "x86_64" ]; then
            echo "::error::Expected an x86_64-only binary but lipo -archs reported '$actual_arch' -- the x64 Python toolchain did not produce an x86_64 PyInstaller binary."
            exit 1
          fi

      - name: Set up Python 3.12 (arm64, native)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Build sidecar binary (arm64, native)
        env:
          PYINSTALLER_TARGET_ARCH: arm64
        run: |
          arch -arm64 python3 -m venv /tmp/venv-arm64
          source /tmp/venv-arm64/bin/activate
          python3 -c "import platform; print('machine:', platform.machine())"
          arch -arm64 python3 -m pip install -e ".[lite]" pyinstaller
          arch -arm64 python3 -m PyInstaller desktop/zerodb-server.spec --distpath desktop/src-tauri/binaries --workpath /tmp/pyi-build-arm64
          deactivate
          mv desktop/src-tauri/binaries/zerodb-server desktop/src-tauri/binaries/zerodb-server-aarch64-apple-darwin
          actual_arch=$(lipo -archs desktop/src-tauri/binaries/zerodb-server-aarch64-apple-darwin)
          echo "zerodb-server-aarch64-apple-darwin reports: $actual_arch"
          if [ "$actual_arch" != "arm64" ]; then
            echo "::error::Expected an arm64-only binary but lipo -archs reported '$actual_arch'."
            exit 1
          fi

      - name: Smoke-test both sidecar binaries
        run: |
          # The x86_64 binary runs under Rosetta translation on this
          # arm64 runner -- a PyInstaller onefile binary re-extracts
          # itself on every launch, and that extraction plus Rosetta's
          # translation overhead on top of this binary's heavy ML deps
          # (torch, sentence-transformers, faiss) made the old 10-attempt
          # / 1s-interval (10s total) budget too tight: run 45758350412
          # failed with the arm64 leg healthy in ~1s but the x86_64 leg
          # still not responding at 10s. Raised to 30 attempts / 2s (60s
          # total) -- generous enough for Rosetta's one-time overhead,
          # still well short of CI's job timeout.
          for bin in desktop/src-tauri/binaries/zerodb-server-aarch64-apple-darwin desktop/src-tauri/binaries/zerodb-server-x86_64-apple-darwin; do
            "$bin" &
            SERVER_PID=$!
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8000/health >/dev/null; then
                echo "$bin: healthy"
                break
              fi
              sleep 2
            done
            curl -sf http://127.0.0.1:8000/health || (echo "$bin: FAILED health check" && exit 1)
            kill $SERVER_PID
            wait $SERVER_PID 2>/dev/null || true
          done

      - name: Lipo sidecar binaries into a universal binary
        run: |
          lipo -create \
            desktop/src-tauri/binaries/zerodb-server-aarch64-apple-darwin \
            desktop/src-tauri/binaries/zerodb-server-x86_64-apple-darwin \
            -output desktop/src-tauri/binaries/zerodb-server-universal-apple-darwin
          chmod +x desktop/src-tauri/binaries/zerodb-server-universal-apple-darwin
          lipo -info desktop/src-tauri/binaries/zerodb-server-universal-apple-darwin

      - name: Install Node deps
        working-directory: desktop
        run: npm ci

      # Refs #145: importing into a dedicated, ephemeral keychain rather than
      # the runner's default login keychain -- avoids polluting a keychain
      # that could persist across jobs on self-hosted runners, and avoids
      # requiring interactive keychain-unlock prompts GitHub's hosted
      # runners can't answer. codesign/tauri look up identities across
      # whatever's in the keychain search list, so the new keychain is
      # added to -- not swapped in for -- that list.
      - name: Import Developer ID certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Fail loudly here rather than silently producing an unsigned
          # build if the import didn't actually work.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Developer ID Application" || \
            (echo "::error::No Developer ID Application identity found in the imported keychain" && exit 1)

      - name: Build Tauri app (universal binary, signed + notarized)
        working-directory: desktop
        # Tauri's bundler itself invokes codesign and (when all four
        # APPLE_* notarization vars are present) xcrun notarytool, and
        # blocks on notarization's `success`/`invalid` result before
        # producing the final .dmg -- no separate codesign/notarytool
        # step needed here. Acceptance criterion from #145: "CI ...
        # submits it to Apple's notary service, waiting for a `success`
        # ticket before packaging the .dmg" is Tauri's own default
        # behavior for this config, not something to hand-roll.
        run: npx tauri build --target universal-apple-darwin
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Toby Morning (5875BWH55P)"

      - name: Verify Gatekeeper accepts the signed, notarized app
        run: |
          # Refs #145's third acceptance criterion: `spctl --assess --type
          # execute` must report "accepted" on a machine with no prior
          # exception -- a fresh GitHub-hosted runner, not this machine's
          # own Keychain/Gatekeeper state, genuinely qualifies as that.
          APP_PATH=$(find desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          echo "Assessing: $APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Clean up temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroDBLocal-macOS-${{ github.ref_name }}
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # Refs #148's second acceptance criterion: release notes must
          # explicitly mention this is the desktop wrapper's first public
          # build. generate_release_notes still adds the auto-generated
          # commit list below this body text, not instead of it.
          body: |
            ZeroDB Desktop for macOS (Apple Silicon + Intel, universal binary).

            This is the first public build of the ZeroDB Desktop wrapper --
            a native macOS app bundling the ZeroDB Local server and
            dashboard, fully signed with a Developer ID certificate and
            notarized by Apple (no Gatekeeper warning on install).

            Download the `.dmg` below, open it, and drag ZeroDB to
            Applications.
          generate_release_notes: true

  build-windows:
    name: Build Windows .exe (NSIS)
    runs-on: windows-latest
    # Refs #156: no code-signing step here yet -- Authenticode is a
    # separate certificate/purchase from the Apple Developer ID used
    # above and is blocked on that acquisition (#157). This produces an
    # UNSIGNED .exe/NSIS installer; Windows SmartScreen will show
    # "Unknown publisher" until #157 lands a signing step here.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      # Mirrors the macOS job's per-arch venv isolation (one target here,
      # so no cross-arch site-packages collision to guard against, but
      # still isolated from the runner's system Python for a clean,
      # reproducible build). zerodb-server.spec itself needs no
      # Windows-specific changes (Refs #155): it builds its paths with
      # pathlib (REPO_ROOT / "lite" / "db" / ...), which resolves
      # correctly on Windows, and target_arch/codesign_identity/
      # entitlements_file are macOS-only EXE() kwargs that PyInstaller
      # ignores outright on non-macOS platforms.
      - name: Build sidecar binary (x86_64-pc-windows-msvc)
        run: |
          python -m venv venv-win
          venv-win\Scripts\Activate.ps1
          python -m pip install -e ".[lite]" pyinstaller
          python -m PyInstaller desktop/zerodb-server.spec --distpath dist-win --workpath build-win
          deactivate
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          Move-Item -Force dist-win/zerodb-server.exe desktop/src-tauri/binaries/zerodb-server-x86_64-pc-windows-msvc.exe
        shell: pwsh

      - name: Smoke-test the sidecar binary
        run: |
          $proc = Start-Process -FilePath "desktop/src-tauri/binaries/zerodb-server-x86_64-pc-windows-msvc.exe" -PassThru
          $healthy = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8000/health" -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200) { $healthy = $true; break }
            } catch {}
            Start-Sleep -Seconds 2
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $healthy) {
            Write-Error "zerodb-server-x86_64-pc-windows-msvc.exe: FAILED health check"
            exit 1
          }
          Write-Host "zerodb-server-x86_64-pc-windows-msvc.exe: healthy"
        shell: pwsh

      - name: Install Node deps
        working-directory: desktop
        run: npm ci

      # No signing env vars here -- Refs #157, blocked on an Authenticode
      # certificate. tauri build's default target on a windows-latest
      # runner is x86_64-pc-windows-msvc, matching the sidecar binary
      # name above; the "nsis": {} block already present in
      # desktop/src-tauri/tauri.conf.json's bundle.windows config is what
      # makes this produce an NSIS .exe installer instead of (or in
      # addition to) an MSI.
      - name: Build Tauri app (unsigned)
        working-directory: desktop
        run: npx tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroDBLocal-Windows-${{ github.ref_name }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
          body: |
            ZeroDB Desktop for Windows (x86_64).

            This build is UNSIGNED -- Windows SmartScreen will show an
            "Unknown publisher" warning until Authenticode code-signing
            (#157) is in place. Functionally identical to the signed
            macOS build otherwise: a native app bundling the ZeroDB Local
            server and dashboard.

            Download the installer below and run it.
          generate_release_notes: true
