name: macOS Desktop Build (Tauri)

# Refs #143 (desktop ship plan, EPIC-B): paths/working-directory used to
# say 'zerodb-local/desktop/**' and 'zerodb-local/desktop', matching this
# repo's layout BEFORE #1 ("Flatten repo layout -- promote zerodb-local/*
# to repo root") moved desktop/ (and everything else) up to the repo
# root. Same bug class ci.yml documents fixing for itself (Refs #43):
# both historical runs of this workflow show `failure` -- the run right
# after the flatten failed in 20 seconds (cd into a directory that no
# longer existed), and the paths: filter has matched nothing since.
# Updated every path to the real post-flatten 'desktop/' layout.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/tauri.yml'
  pull_request:
    paths:
      - 'desktop/**'

jobs:
  build-macos:
    name: Build macOS .dmg
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Refs #141 (desktop ship plan, EPIC-A): `tauri build --target
      # universal-apple-darwin` only auto-merges the Rust binary Cargo
      # compiles -- externalBin sidecars are raw files Tauri just copies
      # by exact name, so it does NOT lipo them for us (confirmed: CI
      # failed with "resource path binaries/zerodb-server-universal-
      # apple-darwin doesn't exist" until the explicit lipo step below
      # was added). Built here rather than committed to git: a real
      # PyInstaller onefile binary is ~250MB, which has no business
      # living in version control.
      #
      # x86_64 leg built FIRST, before the native arm64 setup-python step
      # below changes `python`/`python3` on PATH: actions/setup-python's
      # `architecture: x64` input downloads a real x64 CPython build (not
      # the ancient macOS-system Python) and relies on the OS routing it
      # through Rosetta transparently -- no `arch -x86_64` wrapper needed,
      # and critically a modern pip/3.12, unlike a hand-rolled venv off
      # `/usr/bin/python3` (confirmed directly: that one resolves to
      # system Python 3.9.6, which fails this repo's `requires-python
      # >=3.10`, and ships pip 21.2.4, which predates PEP 660 editable
      # installs for pyproject.toml-only/hatchling projects).
      - name: Set up Python 3.12 (x86_64, for the Intel sidecar build)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Build sidecar binary (x86_64)
        env:
          PYINSTALLER_TARGET_ARCH: x86_64
        run: |
          pip install -e ".[lite]" pyinstaller
          pyinstaller desktop/zerodb-server.spec --distpath /tmp/pyi-dist-x86 --workpath /tmp/pyi-build-x86
          mv /tmp/pyi-dist-x86/zerodb-server desktop/src-tauri/binaries/zerodb-server-x86_64-apple-darwin
          # platform.machine() under Rosetta reports the HOST (arm64) kernel
          # architecture, not the architecture the process is actually
          # running as -- it previously looked like a correct check here and
          # wasn't; lipo -archs reads the Mach-O header itself, which can't
          # lie about what instructions the binary contains.
          actual_arch=$(lipo -archs desktop/src-tauri/binaries/zerodb-server-x86_64-apple-darwin)
          echo "zerodb-server-x86_64-apple-darwin reports: $actual_arch"
          if [ "$actual_arch" != "x86_64" ]; then
            echo "::error::Expected an x86_64-only binary but lipo -archs reported '$actual_arch' -- the x64 Python toolchain did not produce an x86_64 PyInstaller binary."
            exit 1
          fi

      - name: Set up Python 3.12 (arm64, native)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Build sidecar binary (arm64, native)
        env:
          PYINSTALLER_TARGET_ARCH: arm64
        run: |
          pip install -e ".[lite]" pyinstaller
          pyinstaller desktop/zerodb-server.spec --distpath desktop/src-tauri/binaries --workpath /tmp/pyi-build-arm64
          mv desktop/src-tauri/binaries/zerodb-server desktop/src-tauri/binaries/zerodb-server-aarch64-apple-darwin
          actual_arch=$(lipo -archs desktop/src-tauri/binaries/zerodb-server-aarch64-apple-darwin)
          echo "zerodb-server-aarch64-apple-darwin reports: $actual_arch"
          if [ "$actual_arch" != "arm64" ]; then
            echo "::error::Expected an arm64-only binary but lipo -archs reported '$actual_arch'."
            exit 1
          fi

      - name: Smoke-test both sidecar binaries
        run: |
          for bin in desktop/src-tauri/binaries/zerodb-server-aarch64-apple-darwin desktop/src-tauri/binaries/zerodb-server-x86_64-apple-darwin; do
            "$bin" &
            SERVER_PID=$!
            for i in $(seq 1 10); do
              if curl -sf http://127.0.0.1:8000/health >/dev/null; then
                echo "$bin: healthy"
                break
              fi
              sleep 1
            done
            curl -sf http://127.0.0.1:8000/health || (echo "$bin: FAILED health check" && exit 1)
            kill $SERVER_PID
            wait $SERVER_PID 2>/dev/null || true
          done

      - name: Lipo sidecar binaries into a universal binary
        run: |
          lipo -create \
            desktop/src-tauri/binaries/zerodb-server-aarch64-apple-darwin \
            desktop/src-tauri/binaries/zerodb-server-x86_64-apple-darwin \
            -output desktop/src-tauri/binaries/zerodb-server-universal-apple-darwin
          chmod +x desktop/src-tauri/binaries/zerodb-server-universal-apple-darwin
          lipo -info desktop/src-tauri/binaries/zerodb-server-universal-apple-darwin

      - name: Install Node deps
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app (universal binary)
        working-directory: desktop
        run: npx tauri build --target universal-apple-darwin
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroDBLocal-macOS-${{ github.ref_name }}
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
