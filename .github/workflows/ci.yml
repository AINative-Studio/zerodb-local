name: CI

# Refs #43: paths/working-directory used to say 'zerodb-local/**' and
# 'zerodb-local', matching this repo's layout BEFORE #1 ("Flatten repo
# layout — promote zerodb-local/* to repo root", 2026-04-30) moved
# api/, cli/, lite/, zerodb_local/, and tests/ up to the repo root.
# That rename broke this workflow in two ways: the two runs immediately
# after the flatten both FAILED (cd into a directory that no longer
# existed), and after that the paths: filter simply never matched
# anything again, so CI silently stopped triggering at all -- confirmed
# live via `gh run list`, and via 5 real PRs (#38-#42) each showing "no
# checks reported". Updated both to the real post-flatten layout.

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'cli/**'
      - 'lite/**'
      - 'zerodb_local/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'cli/**'
      - 'lite/**'
      - 'zerodb_local/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[lite,dev]"

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check zerodb_local/

      - name: Type check (pyright)
        run: |
          pip install pyright
          pyright zerodb_local/ --pythonversion ${{ matrix.python-version }} || true

      # Refs #49: --cov was scoped to zerodb_local/ only -- after the repo
      # flatten (#1) that package is just two thin wrapper files (cli.py,
      # server.py), while the real tested code lives in api/, lite/, cli/
      # (see pyproject.toml's wheel packages list). Scoping coverage to
      # zerodb_local/ alone made --cov-fail-under=70 fail on every run
      # (including main), regardless of actual test health, since it only
      # ever measured ~56 statements. Measuring all four shipped packages
      # gives a real total of ~7.8% (lite/ itself is 86-99% covered; api/
      # and most of cli/ have little to no test coverage yet -- tracked
      # separately in #50). Threshold lowered to match reality (with a
      # small margin below the current 7.8% baseline): this gate should
      # catch future regressions below today's real coverage, not
      # silently fail unconditionally like before.
      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=zerodb_local --cov=api --cov=lite --cov=cli --cov-report=term-missing --cov-fail-under=7

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build
        run: |
          pip install hatch
          hatch build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
