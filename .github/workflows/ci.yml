name: CI

on:
  push:
    branches: [main]
    paths:
      - 'zerodb-local/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'zerodb-local/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: zerodb-local

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[lite,dev]"

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check zerodb_local/ --select E,F,W --ignore E501

      - name: Type check (pyright)
        run: |
          pip install pyright
          pyright zerodb_local/ --pythonversion ${{ matrix.python-version }} || true

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=zerodb_local --cov-report=term-missing --cov-fail-under=70

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: zerodb-local

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build
        run: |
          pip install hatch
          hatch build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: zerodb-local/dist/
