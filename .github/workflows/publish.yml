name: Release & Publish to PyPI

# Refs #150 (desktop ship plan, EPIC-E): this workflow still had
# `working-directory: zerodb-local` and `packages-dir`/`files` paths under
# `zerodb-local/dist/` -- the layout from before #1 ("Flatten repo layout
# -- promote zerodb-local/* to repo root") moved api/, cli/, lite/,
# zerodb_local/, and tests/ up to the repo root. ci.yml was fixed for the
# same bug class (Refs #43) but this workflow was missed in that pass, so
# every tag push since the flatten would have built from a directory that
# no longer exists and then looked for dist/ output one level too deep.
# This session's 0.3.1 and 0.3.2 PyPI releases were published via manual
# local `twine upload` specifically because this path was never usable.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install hatch
        run: pip install hatch

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Assert pyproject.toml version matches tag
        run: |
          PKG_VERSION=$(hatch version)
          TAG_VERSION=${{ steps.version.outputs.version }}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: pyproject.toml=$PKG_VERSION, tag=$TAG_VERSION"
            exit 1
          fi

      - name: Run tests
        run: |
          pip install -e ".[lite,dev]"
          # Refs #150: --cov=zerodb_local alone only measures a 67-line
          # entry-point shim (zerodb_local/server.py, cli.py) -- none of
          # api/, lite/, cli/, the packages this wheel actually ships
          # (see pyproject.toml's [tool.hatch.build.targets.wheel]
          # packages list) and where virtually all real test coverage
          # lands. Confirmed locally: this exact flag combination failed
          # at 34% against a 70% threshold that was never reachable by
          # construction, even though all 272 tests under tests/ passed.
          # ci.yml already runs the correct, broader invocation (Refs
          # #43) -- mirrored here so publish.yml's gate actually reflects
          # the published package, not a near-empty shim.
          python -m pytest -v --cov=zerodb_local --cov=api --cov=lite --cov=cli --cov-report=term-missing --cov-fail-under=7

      - name: Build distribution
        run: hatch build

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
