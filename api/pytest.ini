[pytest]
# Pytest Configuration for ZeroDB Local API

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.11

# Add current directory to Python path
pythonpath = .

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=.
    --cov-report=term-missing
    --cov-report=html

# Markers
markers =
    integration: Integration tests requiring database and services
    slow: Slow running tests (deselect with '-m "not slow"')
    requires_services: Tests requiring external services (Qdrant, MinIO, RedPanda)
    docker: Tests that build/inspect the real Docker image (requires Docker)
    requires_docker: Tests requiring a running Docker daemon

# Coverage settings
[coverage:run]
source = .
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
# No fail_under threshold yet (unlike cli/pytest.ini's 80%): most of this
# suite's tests require the real Postgres/Qdrant/MinIO/RedPanda stack
# (docker-compose.yml) and are NOT yet consistently marked
# integration/requires_services to exclude them from a unit-only run --
# so there's no trustworthy coverage number to gate on without actually
# running against the live stack. Fixing that marker hygiene is a
# separate, larger effort than this config file; add fail_under once a
# real baseline has been measured against the live services (the
# docker-compose .env.local loading bug that would have broken that
# measurement, Refs #37, is now fixed).

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
