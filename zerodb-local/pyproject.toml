[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerodb-local"
version = "1.0.0"
description = "Complete local development environment for ZeroDB with Docker Compose"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AINative Studio", email = "hello@ainative.studio"}
]
maintainers = [
    {name = "AINative Studio", email = "hello@ainative.studio"}
]
keywords = ["zerodb", "database", "vector", "embeddings", "docker", "local", "development"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
]

[project.urls]
"Homepage" = "https://www.ainative.studio"
"Bug Tracker" = "https://github.com/relycapital/core/issues"
"Documentation" = "https://www.ainative.studio/docs"
"Source Code" = "https://github.com/relycapital/core/tree/main/zerodb-local"

[project.scripts]
zerodb = "cli.zerodb_main:app"
zerodb-local = "cli.zerodb_main:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "api*", "dashboard*", "embeddings*", "scripts*"]
exclude = ["tests*", "*.tests*", "node_modules*", "__pycache__*", "*.venv*"]

[tool.setuptools.package-data]
"*" = [
    "docker-compose.yml",
    ".env*.example",
    "*.sh",
    "*.md",
]
