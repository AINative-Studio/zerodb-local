[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zerodb-local"
version = "0.2.0"
description = "ZeroDB Local — run ZeroDB locally without Docker"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "AINative Studio" }]
keywords = ["zerodb", "database", "vector", "ai", "local", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "sqlalchemy>=2.0.0",
    "typer[all]>=0.9.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
lite = [
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.2.0",
]
full = [
    "psycopg2-binary>=2.9.0",
    "qdrant-client>=1.7.0",
    "minio>=7.0.0",
    "kafka-python>=2.0.0",
    "asyncpg>=0.29.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
zerodb = "zerodb_local.cli:app"

[project.urls]
Homepage = "https://zerodb.ai"
Documentation = "https://docs.zerodb.ai"
Repository = "https://github.com/AINative-Studio/core"
Issues = "https://github.com/AINative-Studio/core/issues"

[tool.hatch.build.targets.wheel]
packages = ["zerodb_local"]

[tool.hatch.build.targets.sdist]
include = [
    "zerodb_local/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
