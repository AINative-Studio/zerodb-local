[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zerodb-local"
version = "0.2.0"
description = "ZeroDB Local — run ZeroDB locally without Docker"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "AINative Studio" }]
keywords = ["zerodb", "database", "vector", "ai", "local", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "sqlalchemy>=2.0.0",
    "typer[all]>=0.9.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    # Refs #46, #50: both used unconditionally by the cloud-sync code path
    # (cli/sync_planner.py and api/services/cloud_client.py respectively),
    # imported at `api.main` startup regardless of lite/full backend mode --
    # not full-mode-only dependencies, so they belong in core deps rather
    # than the `full` extra. tenacity was previously only declared in
    # api/requirements.txt, never in this pyproject.toml, so a plain
    # `pip install -e '.[lite,dev]'` install lacked both.
    "requests>=2.28.0",
    "tenacity>=8.2.0",
    # Refs #107: api/services/vector_service.py is imported unconditionally
    # (it dispatches to FAISS or real Qdrant internally, there's no
    # separate lite-mode module the way some other services have) and uses
    # DBOS to make its SQL-then-Qdrant/FAISS two-system write resumable
    # after a crash. Runs with zero extra setup in both modes -- SQLite by
    # default, no Postgres requirement.
    "dbos>=0.20.0",
]

[project.optional-dependencies]
lite = [
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.2.0",
]
full = [
    "psycopg2-binary>=2.9.0",
    "qdrant-client>=1.7.0",
    "minio>=7.0.0",
    "kafka-python>=2.0.0",
    "asyncpg>=0.29.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
zerodb = "zerodb_local.cli:app"

[project.urls]
Homepage = "https://zerodb.ai"
Documentation = "https://docs.zerodb.ai"
Repository = "https://github.com/AINative-Studio/zerodb-local"
Issues = "https://github.com/AINative-Studio/zerodb-local/issues"

[tool.hatch.build.targets.wheel]
packages = ["zerodb_local", "api", "lite", "cli"]

[tool.hatch.build.targets.wheel.force-include]

[tool.hatch.build.targets.sdist]
include = [
    "zerodb_local/",
    "api/",
    "lite/",
    "cli/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "cli/publish_env/",
    "cli/test_cli_venv/",
    "cli/test_user_env/",
    "cli/venv/",
    "cli/.venv/",
    "cli/tests/",
    "**/__pycache__/",
    "**/*.pyc",
    "data/",
    "build/",
    "dist/",
    "fresh_install/",
    "dashboard/",
    "embeddings/",
    "docs/",
    "scripts/",
    "*.egg-info/",
    ".env*",
]

[tool.pytest.ini_options]
# api/tests/ (19 files) kept physically separate from the top-level tests/
# rather than merged into it (Refs #50): it tests a different thing -- the
# real FastAPI app (api/main.py and its routers) via its own conftest.py,
# which in turn depends on api/'s bare-import convention (api/ as a
# sys.path root, matching how api/Dockerfile actually runs it in
# production) -- while top-level tests/ tests lite/* and other packages
# via the repo's normal dotted-import convention and never imports
# anything from api/ today. Merging them would mean either converting one
# suite's imports to match the other's convention (same large blast radius
# the issue weighs against for production code) or keeping two incompatible
# per-directory conftest.py setups side by side anyway -- no real benefit
# over just listing both directories here.
testpaths = ["tests", "api/tests"]
asyncio_mode = "auto"
# Required once api/tests/ joined testpaths alongside tests/: both
# directories are `__init__.py` packages named "tests" (api/ itself has no
# __init__.py, so pytest's prepend import-mode can't climb high enough to
# disambiguate "api.tests.conftest" from the top-level "tests.conftest" --
# both resolve to the same module name "tests.conftest" and pytest refuses
# the collision with ImportPathMismatchError). importlib mode imports each
# test/conftest file by its file path instead of inferring a dotted module
# name from directory structure, which sidesteps the collision without
# requiring either suite to change its layout or import convention.
# Refs #50.
addopts = "--import-mode=importlib"

[tool.ruff]
# Matches the selection/ignore .github/workflows/ci.yml's "Lint (ruff)" step
# already ran inline (--select E,F,W --ignore E501) -- persisted here so it's
# the same config whether run in CI or locally, and discoverable without
# reading the workflow file. E501 (line length) ignored: this repo has no
# enforced line-length convention elsewhere.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
